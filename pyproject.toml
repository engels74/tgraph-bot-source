[project]
name = "tgraph-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "engels74", email = "141435164+engels74@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "nextcord>=2.6.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "seaborn>=0.13.0,<1.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "aiohttp-jinja2>=1.6.0,<2.0.0",
    "ruamel.yaml>=0.18.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "ruff>=0.1.0",
    "basedpyright>=1.0.0",
]

[project.scripts]
tgraph-bot = "tgraph_bot:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "C90"]
ignore = ["E501"]
fixable = ["ALL"]

[tool.ruff.format]
docstring-code-format = true

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "recommended"
failOnWarnings = true
pythonPlatform = "All"
exclude = ["htmlcov", ".venv"]
enableTypeIgnoreComments = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=tgraph_bot",
]